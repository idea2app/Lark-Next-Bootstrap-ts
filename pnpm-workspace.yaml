packages:
  - .
autoInstallPeers: false
minimumReleaseAge: 0

patchedDependencies:
  'next@16.4.6': 'patches/next@16.4.6.patch'
allowBuilds:
  '@sentry/cli': true
  core-js: true
  less: true
  sharp: true
  unrs-resolver: true
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
